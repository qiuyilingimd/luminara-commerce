services:
  - type: web
    name: luminara-commerce
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.mjs
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: BASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ORDER_NOTIFY_EMAIL
        sync: false
      - key: ORDER_FROM_EMAIL
        sync: false
    disk:
      name: luminara-data
      mountPath: /var/data
      sizeGB: 1
