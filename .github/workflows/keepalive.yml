name: Keep Luminara warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Wake Render service
        run: |
          curl --fail --silent --show-error --location \
            --retry 2 --retry-delay 15 --max-time 120 \
            "https://luminara-commerce.onrender.com/api/health" > /dev/null
