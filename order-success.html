<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order received · Luminara</title>
  <link rel="stylesheet" href="vendor/fonts.css">
  <style>
    :root{--ink:#16110f;--paper:#f5f1e8;--ivory:#fff9ee;--gold:#a98243;--muted:#655d52}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;background:var(--paper);color:var(--ink);font-family:"Jost","Helvetica Neue",Arial,sans-serif}
    header{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;border-bottom:1px solid rgba(18,16,14,.14)}
    header a{color:inherit;text-decoration:none}
    .brand{font-family:"Playfair Display",Georgia,serif;font-size:19px;letter-spacing:.2em;text-transform:uppercase}
    .back{font-family:"Jost",sans-serif;font-size:10px;letter-spacing:.18em;text-transform:uppercase}
    main{max-width:860px;margin:0 auto;padding:11vh 24px 10vh}
    .eyebrow{font-family:"Jost",sans-serif;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
    h1{margin:16px 0 24px;font-size:clamp(3rem,8vw,6.8rem);font-style:italic;font-weight:400;line-height:.9;letter-spacing:-.035em}
    .lede{max-width:46ch;font-size:20px;line-height:1.65;color:var(--muted)}
    .summary{margin-top:42px;border-top:1px solid rgba(18,16,14,.18)}
    .row{display:flex;justify-content:space-between;gap:24px;padding:13px 0;border-bottom:1px solid rgba(18,16,14,.12);font-family:"Jost",sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
    .row b{font-weight:400;color:var(--ink);text-align:right}
    .status{margin-top:24px;padding:18px;border:1px solid rgba(18,16,14,.16);font-family:"Jost",sans-serif;font-size:11px;line-height:1.8;letter-spacing:.08em}
    .cta{display:inline-flex;margin-top:34px;padding:14px 20px;background:var(--ink);color:var(--ivory);text-decoration:none;font-family:"Jost",sans-serif;font-size:10px;letter-spacing:.2em;text-transform:uppercase}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">Luminara</a>
    <a class="back" href="/">Return to shop</a>
  </header>
  <main>
    <p class="eyebrow">Luminara · Order status</p>
    <h1 id="title">Order received.</h1>
    <p class="lede" id="message">We are checking the order details.</p>
    <div class="summary" id="summary" hidden>
      <div class="row"><span>Order</span><b id="orderId">—</b></div>
      <div class="row"><span>Status</span><b id="status">—</b></div>
      <div class="row"><span>Total</span><b id="total">—</b></div>
    </div>
    <p class="status" id="statusNote">You can close this page safely.</p>
    <a class="cta" href="./">Continue shopping</a>
  </main>
  <script>
    (async function(){
      var params=new URLSearchParams(location.search);
      var id=params.get("order_id");
      if(!id)return;
      try{
        var host=location.hostname;
        var apiBase=(host==="luminara-commerce.onrender.com"||host==="localhost"||host==="127.0.0.1") ? "" : "https://luminara-commerce.onrender.com";
        var response=await fetch(apiBase+"/api/orders/"+encodeURIComponent(id));
        if(!response.ok)throw new Error("Order lookup failed");
        var order=await response.json();
        document.querySelector("#summary").hidden=false;
        document.querySelector("#orderId").textContent=order.id;
        document.querySelector("#status").textContent=order.status.replaceAll("_"," ");
        document.querySelector("#total").textContent="$"+Number(order.total).toFixed(0)+" USD";
        if(order.status==="paid"){
          document.querySelector("#title").textContent="Payment confirmed.";
          document.querySelector("#message").textContent="Thank you. We will email tracking details once your order ships.";
          document.querySelector("#statusNote").textContent="A receipt and dispatch notice will follow by email.";
        }else{
          document.querySelector("#message").textContent="Your order has been received. We will confirm stock, shipping and import duties before sending a secure payment link.";
          document.querySelector("#statusNote").textContent="No payment has been taken yet.";
        }
      }catch{
        document.querySelector("#message").textContent="We could not load the order in this browser. Please contact Luminara if you need an update.";
      }
    })();
  </script>
</body>
</html>
